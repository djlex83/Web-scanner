<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="Strichcodes und QR-Codes scannen – sofort sehen, wo jedes Stück liegt." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scanner" />
    <link rel="icon" href="/symbol.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/symbol-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Web Scanner</title>
    <script>
      // Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try {
        var t = localStorage.getItem("ws-thema");
        var d = t === "dunkel" || (t !== "hell" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dunkel" : "hell";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
